name: Windows Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    name: Build and release Windows
    runs-on: windows-latest

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter installation
        run: flutter doctor -v

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package Windows release
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME
          $packageName = "framework-diagnostic-tool-$version-windows-x64"
          $source = "build/windows/x64/runner/Release"
          $staging = "release/$packageName"
          $zip = "release/$packageName.zip"

          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item -Path "$source/*" -Destination $staging -Recurse -Force
          Compress-Archive -Path "$staging/*" -DestinationPath $zip -Force

          "PACKAGE_NAME=$packageName" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PACKAGE_PATH=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "${{ env.PACKAGE_PATH }}" `
            --title "Framework Diagnostic Tool ${{ github.ref_name }}" `
            --generate-notes
